ont-weight="500" font-size="13.0" fill="#141413" data-role="ground" text-anchor="middle" data-font-role="monom" letter-spacing="0.5">GET STARTED</text><line x1="0.0" y1="72.0" x2="1440.0" y2="72.0" stroke="#292927" stroke-width="1.0" data-deco="1"/><line x1="384.0" y1="72.0" x2="384.0" y2="900.0" stroke="#292927" stroke-width="1.0" data-deco="1"/><text data-slot="rail_title" data-kind="text" data-max-chars="64" data-lines="3" data-title="1" data-box="45.0,98.0,288.0,77.0" x="48.0" y="118.0" font-family="'Inter','Geist','Noto Sans SC',sans-serif" font-weight="500" font-size="20.0" fill="#FAF9F5" data-role="ink" text-anchor="start" data-font-role="title"><tspan x="48.0" dy="0">Teaching a test harness to</tspan><tspan x="48.0" dy="26.0">explain its own failures</tspan></text><text data-slot="tree_label" data-kind="text" data-max-chars="8" data-box="45.0,214.0,44.2,15.0" x="48.0" y="226.0" font-family="'JetBrains Mono','IBM Plex Mono','Geist Mono','Noto Sans SC',monospace" font-weight="400" font-size="12.0" fill="#87867F" data-role="mute" text-anchor="start" data-font-role="mono" letter-spacing="1.2">TREE</text><path data-deco="1" d="M51.0 237.5V251.5H61.0" fill="none" stroke="#87867F" stroke-width="1.3"/><text data-slot="tree_1" data-kind="text" data-max-chars="22" data-box="65.0,243.0,284.0,16.3" x="68.0" y="256.0" font-family="'JetBrains Mono','IBM Plex Mono','Geist Mono','Noto Sans SC',monospace" font-weight="400" font-size="13.0" fill="#87867F" data-role="mute" text-anchor="start" data-font-role="mono" letter-spacing="0.3">Overview</text><path data-deco="1" d="M71.0 263.5V277.5H81.0" fill="none" stroke="#87867F" stroke-width="1.3"/><text data-slot="tree_2" data-kind="text" data-max-chars="22" data-box="85.0,269.0,264.0,16.3" x="88.0" y="282.0" font-family="'JetBrains Mono','IBM Plex Mono','Geist Mono','Noto Sans SC',monospace" font-weight="700" font-size="13.0" fill="#FAF9F5" data-role="ink" text-anchor="start" data-font-role="mono" letter-spacing="0.3">Pin the clock</text><path data-deco="1" d="M71.0 289.5V303.5H81.0" fill="none" stroke="#87867F" stroke-width="1.3"/><text data-slot="tree_3" data-kind="text" data-max-chars="22" data-box="85.0,295.0,264.0,16.3" x="88.0" y="308.0" font-family="'JetBrains Mono','IBM Plex Mono','Geist Mono','Noto Sans SC',monospace" font-weight="400" font-size="13.0" fill="#87867F" data-role="mute" text-anchor="start" data-font-role="mono" letter-spacing="0.3">Name the order</text><path data-deco="1" d="M51.0 315.5V329.5H61.0" fill="none" stroke="#87867F" stroke-width="1.3"/><text data-slot="tree_4" data-kind="text" data-max-chars="22" data-box="65.0,321.0,284.0,16.3" x="68.0" y="334.0" font-family="'JetBrains Mono','IBM Plex Mono','Geist Mono','Noto Sans SC',monospace" font-weight="400" font-size="13.0" fill="#87867F" data-role="mute" text-anchor="start" data-font-role="mono" letter-spacing="0.3">Reading a trace</text><path data-deco="1" d="M71.0 341.5V355.5H81.0" fill="none" stroke="#87867F" stroke-width="1.3"/><text data-slot="tree_5" data-kind="text" data-max-chars="22" data-box="85.0,347.0,264.0,16.3" x="88.0" y="360.0" font-family="'JetBrains Mono','IBM Plex Mono','Geist Mono','Noto Sans SC',monospace" font-weight="400" font-size="13.0" fill="#87867F" data-role="mute" text-anchor="start" data-font-role="mono" letter-spacing="0.3">Verdict lines</text><path data-deco="1" d="M71.0 367.5V381.5H81.0" fill="none" stroke="#87867F" stroke-width="1.3"/><text data-slot="tree_6" data-kind="text" data-max-chars="22" data-box="85.0,373.0,264.0,16.3" x="88.0" y="386.0" font-family="'JetBrains Mono','IBM Plex Mono','Geist Mono','Noto Sans SC',monospace" font-weight="400" font-size="13.0" fill="#87867F" data-role="mute" text-anchor="start" data-font-role="mono" letter-spacing="0.3">What broke</text><path data-deco="1" d="M51.0 393.5V407.5H61.0" fill="none" stroke="#87867F" stroke-width="1.3"/><text data-slot="tree_7" data-kind="text" data-max-chars="22" data-box="65.0,399.0,284.0,16.3" x="68.0" y="412.0" font-family="'JetBrains Mono','IBM Plex Mono','Geist Mono','Noto Sans SC',monospace" font-weight="400" font-size="13.0" fill="#87867F" data-role="mute" text-anchor="start" data-font-role="mono" letter-spacing="0.3">Next steps</text><g data-deco="1"><g fill="#B0AEA5"><rect x="48.0" y="452.0" width="8.0" height="14.0"/><rect x="58.0" y="452.0" width="8.0" height="14.0"/><rect x="68.0" y="452.0" width="8.0" height="14.0"/><rect x="78.0" y="452.0" width="8.0" height="14.0"/><rect x="88.0" y="452.0" width="8.0" height="14.0"/><rect x="98.0" y="452.0" width="8.0" height="14.0"/><rect x="108.0" y="452.0" width="8.0" height="14.0"/><rect x="118.0" y="452.0" width="8.0" height="14.0"/></g><g fill="#5E5D59"><rect x="128.0" y="452.0" width="8.0" height="14.0"/><rect x="138.0" y="452.0" width="8.0" height="14.0"/><rect x="148.0" y="452.0" width="8.0" height="14.0"/><rect x="158.0" y="452.0" width="8.0" height="14.0"/><rect x="168.0" y="452.0" width="8.0" height="14.0"/><rect x="178.0" y="452.0" width="8.0" height="14.0"/><rect x="188.0" y="452.0" width="8.0" height="14.0"/><rect x="198.0" y="452.0" width="8.0" height="14.0"/><rect x="208.0" y="452.0" width="8.0" height="14.0"/><rect x="218.0" y="452.0" width="8.0" height="14.0"/><rect x="228.0" y="452.0" width="8.0" height="14.0"/><rect x="238.0" y="452.0" width="8.0" height="14.0"/></g></g><text data-slot="percent" data-kind="text" data-max-chars="4" data-box="253.0,451.0,35.5,16.3" x="256.0" y="464.0" font-family="'JetBrains Mono','IBM Plex Mono','Geist Mono','Noto Sans SC',monospace" font-weight="400" font-size="13.0" fill="#FAF9F5" data-role="ink" text-anchor="start" data-font-role="mono" letter-spacing="0.3">42%</text><text data-slot="read_time" data-kind="text" data-max-chars="14" data-box="45.0,492.0,102.8,15.0" x="48.0" y="504.0" font-family="'JetBrains Mono','IBM Plex Mono','Geist Mono','Noto Sans SC',monospace" font-weight="400" font-size="12.0" fill="#87867F" data-role="mute" text-anchor="start" data-font-role="mono" letter-spacing="1.2">10 MIN READ</text><text data-slot="share_label" data-kind="text" data-max-chars="8" data-box="45.0,548.0,54.7,15.0" x="48.0" y="560.0" font-family="'JetBrains Mono','IBM Plex Mono','Geist Mono','Noto Sans SC',monospace" font-weight="400" font-size="12.0" fill="#87867F" data-role="mute" text-anchor="start" data-font-role="mono" letter-spacing="1.2">SHARE</text><path data-deco="1" d="M51.0 571.5V585.5H61.0" fill="none" stroke="#87867F" stroke-width="1.3"/><text data-slot="share_1" data-kind="text" data-max-chars="14" data-box="65.0,577.0,89.8,16.3" x="68.0" y="590.0" font-family="'JetBrains Mono','IBM Plex Mono','Geist Mono','Noto Sans SC',monospace" font-weight="400" font-size="13.0" fill="#B0AEA5" data-role="body" text-anchor="start" data-font-role="mono" letter-spacing="0.5">COPY LINK</text><path data-deco="1" d="M51.0 597.5V611.5H61.0" fill="none" stroke="#87867F" stroke-width="1.3"/><text data-slot="share_2" data-kind="text" data-max-chars="14" data-box="65.0,603.0,45.9,16.3" x="68.0" y="616.0" font-family="'JetBrains Mono','IBM Plex Mono','Geist Mono','Noto Sans SC',monospace" font-weight="400" font-size="13.0" fill="#B0AEA5" data-role="body" text-anchor="start" data-font-role="mono" letter-spacing="0.5">POST</text><path data-deco="1" d="M51.0 623.5V637.5H61.0" fill="none" stroke="#87867F" stroke-width="1.3"/><text data-slot="share_3" data-kind="text" data-max-chars="14" data-box="65.0,629.0,57.9,16.3" x="68.0" y="642.0" font-family="'JetBrains Mono','IBM Plex Mono','Geist Mono','Noto Sans SC',monospace" font-weight="400" font-size="13.0" fill="#B0AEA5" data-role="body" text-anchor="start" data-font-role="mono" letter-spacing="0.5">EMAIL</text><text data-slot="sec_title" data-kind="text" data-max-chars="34" data-box="599.0,132.3,290.0,19.7" x="602.0" y="148.0" font-family="'JetBrains Mono','IBM Plex Mono','Geist Mono','Noto Sans SC',monospace" font-weight="500" font-size="15.8" fill="#FAF9F5" data-role="ink" text-anchor="start" data-font-role="monom" letter-spacing="0.9">WHY FAILURES NEED A STORY</text><text data-slot="para_1" data-kind="text" data-max-chars="300" data-lines="5" data-box="599.0,172.0,620.0,137.7" x="602.0" y="190.0" font-family="'Inter','Geist','Noto Sans SC',sans-serif" font-weight="400" font-size="18.0" fill="#B0AEA5" data-role="body" text-anchor="start" data-font-role="sans"><tspan x="602.0" dy="0">A flaky test is rarely random. It is usually a promise the code never</tspan><tspan x="602.0" dy="28.8">made: that two jobs finish in a fixed order, that a clock only moves</tspan><tspan x="602.0" dy="28.8">forward, that a port is free. We stopped retrying failures and</tspan><tspan x="602.0" dy="28.8">started asking what each one had assumed.</tspan></text><rect data-deco="1" x="602.0" y="337.0" width="5.0" height="5.0" fill="#5E5D59"/><text data-slot="item_lead_1" data-kind="text" data-max-chars="20" data-box="621.0,328.0,122.6,22.5" x="624.0" y="346.0" font-family="'Inter','Geist','Noto Sans SC',sans-serif" font-weight="600" font-size="18.0" fill="#FAF9F5" data-role="ink" text-anchor="start" data-font-role="sans">Pin the clock</text><text data-slot="item_rest_1" data-kind="text" data-max-chars="48" data-box="739.2,328.0,479.8,22.5" x="742.2" y="346.0" font-family="'Inter','Geist','Noto Sans SC',sans-serif" font-weight="400" font-size="18.0" fill="#B0AEA5" data-role="body" text-anchor="start" data-font-role="sans">so every run starts at the same second.</text><rect data-deco="1" x="602.0" y="371.0" width="5.0" height="5.0" fill="#5E5D59"/><text data-slot="item_lead_2" data-kind="text" data-max-chars="20" data-box="621.0,362.0,148.9,22.5" x="624.0" y="380.0" font-family="'Inter','Geist','Noto Sans SC',sans-serif" font-weight="600" font-size="18.0" fill="#FAF9F5" data-role="ink" text-anchor="start" data-font-role="sans">Name the order</text><text data-slot="item_rest_2" data-kind="text" data-max-chars="48" data-box="764.7,362.0,454.3,22.5" x="767.7" y="380.0" font-family="'Inter','Geist','Noto Sans SC',sans-serif" font-weight="400" font-size="18.0" fill="#B0AEA5" data-role="body" text-anchor="start" data-font-role="sans">when two steps must happen in sequence.</text><rect data-deco="1" x="602.0" y="405.0" width="5.0" height="5.0" fill="#5E5D59"/><text data-slot="item_lead_3" data-kind="text" data-max-chars="20" data-box="621.0,396.0,123.2,22.5" x="624.0" y="414.0" font-family="'Inter','Geist','Noto Sans SC',sans-serif" font-weight="600" font-size="18.0" fill="#FAF9F5" data-role="ink" text-anchor="start" data-font-role="sans">Log the seed</text><text data-slot="item_rest_3" data-kind="text" data-max-chars="48" data-box="739.7,396.0,479.3,22.5" x="742.7" y="414.0" font-family="'Inter','Geist','Noto Sans SC',sans-serif" font-weight="400" font-size="18.0" fill="#B0AEA5" data-role="body" text-anchor="start" data-font-role="sans">on the first line of the report.</text><text data-slot="sub_title" data-kind="text" data-max-chars="30" data-box="599.0,454.3,166.6,19.7" x="602.0" y="470.0" font-family="'JetBrains Mono','IBM Plex Mono','Geist Mono','Noto Sans SC',monospace" font-weight="500" font-size="15.8" fill="#FAF9F5" data-role="ink" text-anchor="start" data-font-role="monom">Reading the trace</text><text data-slot="para_2" data-kind="text" data-max-chars="260" data-lines="4" data-box="599.0,492.0,620.0,108.9" x="602.0" y="510.0" font-family="'Inter','Geist','Noto Sans SC',sans-serif" font-weight="400" font-size="18.0" fill="#B0AEA5" data-role="body" text-anchor="start" data-font-role="sans"><tspan x="602.0" dy="0">Each trace now ends with a one-line verdict written for a person,</tspan><tspan x="602.0" dy="28.8">not a parser. If the verdict is wrong, that is a bug we can</tspan><tspan x="602.0" dy="28.8">reproduce, and the fix lands next to the test that found it.</tspan></text><g id="guides" display="none"></g></svg>
