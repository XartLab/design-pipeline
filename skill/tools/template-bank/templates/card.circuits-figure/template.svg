,630.4,46.0,27.0" x="922.0" y="650.0" font-family="'Roboto Mono','Noto Sans SC',monospace" font-weight="400" font-size="20.0" fill="#000000" data-role="ink" text-anchor="middle" data-font-role="mono">回升</text><text data-slot="stream_label" data-kind="text" data-max-chars="10" data-box="267.0,216.8,204.0,19.0" x="269.0" y="232.0" font-family="'IBM Plex Sans','Noto Sans SC',sans-serif" font-weight="400" font-size="15.0" fill="#666666" data-role="mute" text-anchor="start" data-font-role="sans">残差流</text><text data-slot="cap_label" data-kind="text" data-max-chars="6" data-box="94.0,747.0,94.0,21.0" x="96.0" y="764.0" font-family="'IBM Plex Sans','Noto Sans SC',sans-serif" font-weight="700" font-size="17.0" fill="#000000" data-role="ink" text-anchor="start" data-font-role="sans">图 2：</text><text data-slot="caption" data-kind="text" data-max-chars="70" data-lines="2" data-box="152.8,747.0,949.2,46.5" x="154.8" y="764.0" font-family="'IBM Plex Sans','Noto Sans SC',sans-serif" font-weight="400" font-size="17.0" fill="#333333" data-role="text" text-anchor="start" data-font-role="sans">每个位置有一条残差流；每层的注意力与前馈块从流里读入，把结果加回。示意图，非真实模型。</text><g data-deco="1"><rect x="1180.0" y="170.0" width="60.0" height="76.0" rx="4.0" fill="#F6F6F3" stroke="#B8B6AD" stroke-width="2.0"/><rect x="1202.0" y="180.0" width="5.0" height="56.0" rx="2.5" fill="#E6E3D6"/><path d="M1207.0 194.0H1226.0M1207.0 216.0H1226.0" stroke="#C46686" stroke-width="2.0" stroke-linecap="round"/></g><text data-slot="margin_label" data-kind="text" data-max-chars="14" data-box="1256.0,183.9,250.0,20.0" x="1258.0" y="200.0" font-family="'IBM Plex Sans','Noto Sans SC',sans-serif" font-weight="600" font-size="16.0" fill="#000000" data-role="ink" text-anchor="start" data-font-role="sans">读入与写回</text><text data-slot="margin_text" data-kind="text" data-max-chars="80" data-lines="5" data-box="1178.0,265.0,328.0,126.4" x="1180.0" y="282.0" font-family="'IBM Plex Sans','Noto Sans SC',sans-serif" font-weight="400" font-size="17.0" fill="#666666" data-role="mute" text-anchor="start" data-font-role="sans"><tspan x="1180.0" dy="0">因为每层都只是把输出加回残差流，层与层</tspan><tspan x="1180.0" dy="26.4">之间可以直接通信；后面的层读到的是前面</tspan><tspan x="1180.0" dy="26.4">所有层写入之和。</tspan></text><g id="guides" display="none"><rect x="96.0" y="150.0" width="1004.0" height="660.0" fill="none" stroke="#00C080" stroke-width="2" stroke-dasharray="10 6"/><text x="102.0" y="168.0" font-family="monospace" font-size="14" fill="#00C080">figure (keep listed slots inside)</text></g></svg>
