<linearGradient id="scrimB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.72"/></linearGradient><linearGradient id="fadeW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient></defs><rect x="0.0" y="0.0" width="1600.0" height="900.0" fill="#FFFFFF" data-role="white"/><text data-slot="toc_title" data-kind="text" data-max-chars="4" data-box="94.0,115.4,424.0,32.0" x="96.0" y="142.0" font-family="'IBM Plex Sans','Noto Sans SC',sans-serif" font-weight="700" font-size="28.0" fill="#000000" data-role="ink" text-anchor="start" data-font-role="sans">目录</text><text data-slot="toc_1" data-kind="text" data-max-chars="14" data-box="94.0,190.2,400.0,22.0" x="96.0" y="208.0" font-family="'IBM Plex Sans','Noto Sans SC',sans-serif" font-weight="600" font-size="18.0" fill="#333333" data-role="text" text-anchor="start" data-font-role="sans">摘要</text><text data-slot="toc_2" data-kind="text" data-max-chars="14" data-box="94.0,234.2,400.0,22.0" x="96.0" y="252.0" font-family="'IBM Plex Sans','Noto Sans SC',sans-serif" font-weight="600" font-size="18.0" fill="#333333" data-role="text" text-anchor="start" data-font-role="sans">1 引言</text><text data-slot="toc_3" data-kind="text" data-max-chars="14" data-box="94.0,278.2,400.0,22.0" x="96.0" y="296.0" font-family="'IBM Plex Sans','Noto Sans SC',sans-serif" font-weight="600" font-size="18.0" fill="#333333" data-role="text" text-anchor="start" data-font-role="sans">2 模型与方法</text><rect x="82.0" y="319.0" width="3.0" height="28.0" rx="1.5" fill="#633636" data-role="maroon"/><text data-slot="toc_4" data-kind="text" data-max-chars="14" data-box="116.0,322.2,378.0,22.0" x="118.0" y="340.0" font-family="'IBM Plex Sans','Noto Sans SC',sans-serif" font-weight="600" font-size="18.0" fill="#000000" data-role="ink" text-anchor="start" data-font-role="sans">稀疏特征</text><text data-slot="toc_5" data-kind="text" data-max-chars="14" data-box="116.0,366.2,378.0,22.0" x="118.0" y="384.0" font-family="'IBM Plex Sans','Noto Sans SC',sans-serif" font-weight="400" font-size="18.0" fill="#666666" data-role="mute" text-anchor="start" data-font-role="sans">归因图</text><text data-slot="toc_6" data-kind="text" data-max-chars="14" data-box="94.0,410.2,400.0,22.0" x="96.0" y="428.0" font-family="'IBM Plex Sans','Noto Sans SC',sans-serif" font-weight="600" font-size="18.0" fill="#333333" data-role="text" text-anchor="start" data-font-role="sans">3 特征浏览器</text><text data-slot="toc_7" data-kind="text" data-max-chars="14" data-box="94.0,454.2,400.0,22.0" x="96.0" y="472.0" font-family="'IBM Plex Sans','Noto Sans SC',sans-serif" font-weight="600" font-size="18.0" fill="#333333" data-role="text" text-anchor="start" data-font-role="sans">4 结果与局限</text><text data-slot="toc_8" data-kind="text" data-max-chars="14" data-box="94.0,498.2,400.0,22.0" x="96.0" y="516.0" font-family="'IBM Plex Sans','Noto Sans SC',sans-serif" font-weight="600" font-size="18.0" fill="#333333" data-role="text" text-anchor="start" data-font-role="sans">参考文献</text><rect x="516.0" y="114.0" width="1.0" height="560.0" fill="#E5E5E5" data-role="rule"/><text data-slot="kicker" data-kind="text" data-max-chars="10" data-box="638.0,123.9,404.0,20.0" x="640.0" y="140.0" font-family="'IBM Plex Sans','Noto Sans SC',sans-serif" font-weight="600" font-size="16.0" fill="#666666" data-role="mute" text-anchor="start" data-font-role="sans" letter-spacing="1.4">第 2 节</text><text data-slot="heading" data-kind="text" data-max-chars="16" data-box="638.0,163.3,784.0,48.0" x="640.0" y="204.0" font-family="'IBM Plex Sans','Noto Sans SC',sans-serif" font-weight="600" font-size="44.0" fill="#333333" data-role="text" text-anchor="start" data-font-role="sans">模型与方法</text><text data-slot="para" data-kind="text" data-max-chars="150" data-lines="4" data-box="638.0,254.4,784.0,126.0" x="640.0" y="274.0" font-family="'IBM Plex Sans','Noto Sans SC',sans-serif" font-weight="400" font-size="20.0" fill="#333333" data-role="text" text-anchor="start" data-font-role="sans"><tspan x="640.0" dy="0">我们训练一个两层的小型 Transformer，输入是一段离散化的价格序列。为了读出它在</tspan><tspan x="640.0" dy="34.0">算什么，我们在中间层的激活上训练一个稀疏自编码器，把激活拆成少数几个同时亮起的</tspan><tspan x="640.0" dy="34.0">特征。</tspan></text><rect x="674.0" y="444.0" width="746.0" height="150.0" rx="6.0" fill="#F6F6F3" stroke="#E5E5E5" stroke-width="1.0" data-role="node"/><text data-slot="fn_label" data-kind="text" data-max-chars="10" data-box="696.0,467.9,304.0,20.0" x="698.0" y="484.0" font-family="'IBM Plex Sans','Noto Sans SC',sans-serif" font-weight="700" font-size="16.0" fill="#004276" data-role="link" text-anchor="start" data-font-role="sans">脚注 3</text><text data-slot="fn_text" data-kind="text" data-max-chars="90" data-lines="3" data-box="696.0,501.0,702.0,73.7" x="698.0" y="518.0" font-family="'IBM Plex Sans','Noto Sans SC',sans-serif" font-weight="400" font-size="17.0" fill="#666666" data-role="mute" text-anchor="start" data-font-role="sans">特征数取 4096，稀疏系数在示例中取 0.8。以上均为演示用的设定，不对应真实训练。</text><g id="guides" display="none"><rect x="640.0" y="124.0" width="780.0" height="520.0" fill="none" stroke="#00C080" stroke-width="2" stroke-dasharray="10 6"/><text x="646.0" y="142.0" font-family="monospace" font-size="14" fill="#00C080">article (keep listed slots inside)</text></g></svg>
