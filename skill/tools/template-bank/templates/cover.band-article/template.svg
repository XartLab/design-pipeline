rotesk','Inter','Noto Sans SC',sans-serif" font-weight="400" font-size="15.0" fill="#5E5D59" data-role="mute" text-anchor="start" data-font-role="sans">研究组 · 示例文章，文案为占位</text><g id="guides" display="none"><rect x="900.0" y="0.0" width="700.0" height="900.0" fill="none" stroke="#00C080" stroke-width="2" stroke-dasharray="10 6"/><text x="906.0" y="18.0" font-family="monospace" font-size="14" fill="#00C080">copy (keep listed slots inside)</text></g></svg>
