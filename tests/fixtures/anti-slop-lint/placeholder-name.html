<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testimonial</title>
  <style>
    html, body { overflow-x: clip; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #fbfbfd; color: #14141a; }
    .wrap { max-width: 32rem; margin: 4rem auto; padding: 2rem; }
    blockquote { margin: 0; }
    blockquote p { font-size: 1.5rem; line-height: 1.3; }
    footer { margin-top: 1rem; color: #555; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Loved by teams</h1>
    <blockquote>
      <p>We shipped twice as fast after switching.</p>
      <footer>— Jane Doe, Head of Platform</footer>
    </blockquote>
  </main>
</body>
</html>
